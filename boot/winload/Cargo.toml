[package]
name = "winload"
version = "0.1.0"
edition = "2024"
authors = ["XenOS Team"]
description = "XenOS Windows NT-compatible boot loader (winload.exe)"
keywords = ["windows", "nt", "bootloader", "xenos", "winload"]

[dependencies]
uefi = { path = "../../libs/uefi", features = ["alloc", "global_allocator"] }
ntldr = { path = "../../libs/ntldr" }
hive = { path = "../../libs/hive", features = ["alloc"] }
pe = { path = "../../libs/pe" }
log = { version = "0.4", default-features = false }