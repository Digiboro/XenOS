[package]
name = "uefi-macros"
version = "0.19.0"
readme = "README.md"
description = "Procedural macros for the `uefi` crate."
authors = ["The Rust OSDev team", "XenOS Team"]
categories = ["embedded", "no-std", "api-bindings"]
edition = "2024"
keywords = ["uefi", "efi"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AiselK/XenOS"
rust-version = "1.85.1"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.28"
quote = "1.0.9"
syn = { version = "2.0.4", features = ["full"] }

[dev-dependencies]
trybuild = "1.0.61"
uefi = { path = "../uefi", default-features = false }
